<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<title>Sperme intelligent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sperme IA">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
    --accent: #58a6ff; --border: #30363d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  header { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
           padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel); }
  .bar, .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .stats { display: flex; gap: 12px; white-space: nowrap; }
  .stats b { color: var(--accent); }
  label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  input[type=range] { width: 90px; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .mobile-only { display: none; }
  #wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #c { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #help { position: absolute; left: 16px; bottom: 12px; color: var(--muted); font-size: 12px; pointer-events: none; }
  .panel { position: absolute; top: auto; left: auto; right: 16px; background: #161b22cc; border-radius: 6px; pointer-events: none; }
  #chart { bottom: calc(12px + env(safe-area-inset-bottom)); width: 220px; height: 70px; }
  #brain { bottom: 90px; width: 220px; height: 150px; }

  /* Téléphone : barre compacte, réglages dans un menu qui se superpose au terrain. */
  @media (max-width: 640px), (max-height: 500px) {
    header { padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); }
    .controls { max-height: calc(100dvh - 60px); overflow-y: auto; }
    .bar { width: 100%; flex-wrap: nowrap; justify-content: space-between; gap: 8px; }
    h1 { font-size: 18px; }
    h1 .title { display: none; }
    .stats { gap: 10px; font-size: 13px; min-width: 0; overflow: hidden; }
    .mobile-only { display: inline-block; }
    #menu { padding: 4px 10px; font-size: 16px; }
    .controls { display: none; position: absolute; top: 100%; left: 0; right: 0; padding: 12px 14px 14px;
                background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: 0 8px 16px #0008; }
    header.open .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .controls label:has(input[type=range]) { grid-column: 1 / -1; display: grid; grid-template-columns: 88px 1fr 44px; }
    input[type=range] { width: 100%; height: 28px; }
    .controls button { min-height: 40px; }
    #help { left: 10px; right: 10px; top: 8px; bottom: auto; font-size: 11px; }
    #help .desktop { display: none; }
    #chart { right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); width: 150px; height: 52px; }
    #brain { display: none; right: 8px; bottom: 68px; width: 220px; height: 140px; }
    body.show-brain #brain { display: block; }
  }
  @media (min-width: 641px) and (min-height: 501px) { #help .mobile { display: none; } }
  #install[hidden] { display: none; }
  #installHelp { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #000a; }
  #installHelp[hidden] { display: none; }
  #installHelp .card { max-width: 340px; padding: 18px 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
  #installHelp h2 { margin: 0 0 10px; font-size: 17px; }
  #installHelp ol { margin: 0 0 14px; padding-left: 20px; line-height: 1.6; }
  #installHelp button { width: 100%; min-height: 40px; }
</style>
</head>
<body>
<header id="header">
  <div class="bar">
    <h1>🧬<span class="title"> Sperme intelligent</span></h1>
    <div class="stats">
      <span>Gén. <b id="gen">1</b></span>
      <span>Arrivés <b id="hits">0</b>/<b id="pop">0</b></span>
      <span>Record <b id="best">0</b></span>
    </div>
    <button id="menu" class="mobile-only" type="button" aria-expanded="false" aria-controls="controls" aria-label="Réglages">⚙</button>
  </div>
  <div class="controls" id="controls">
    <label>Population <input id="popSize" type="range" min="20" max="400" value="150"><span id="popV">150</span></label>
    <label>Mutation <input id="mut" type="range" min="0" max="30" step="1" value="8"><span id="mutV">8%</span></label>
    <label>Vitesse <input id="speed" type="range" min="1" max="30" value="1"><span id="speedV">×1</span></label>
    <label><input id="roam" type="checkbox"> Ovule mobile</label>
    <button id="brainToggle" class="mobile-only" type="button">Cerveau</button>
    <button id="install" type="button" hidden>📲 Installer</button>
    <button id="pause" type="button">Pause</button>
    <button id="clearWalls" type="button">Effacer obstacles</button>
    <button id="reset" type="button">Recommencer</button>
  </div>
</header>
<div id="wrap">
  <canvas id="c"></canvas>
  <canvas id="brain" class="panel"></canvas>
  <canvas id="chart" class="panel"></canvas>
  <div id="help"><span class="desktop">Glisser : dessiner un obstacle · Clic droit / appui long : déplacer l'ovule · En jaune : le champion et ses capteurs</span><span class="mobile">Glisser : obstacle · Appui long : déplacer l'ovule</span></div>
</div>
<div id="installHelp" role="dialog" aria-modal="true" aria-labelledby="installTitle" hidden>
  <div class="card">
    <h2 id="installTitle">Installer le jeu</h2>
    <ol id="installSteps"></ol>
    <button id="installClose" type="button">Compris</button>
  </div>
</div>
<script>
// Chaque spermatozoïde est un agent doté d'un petit réseau de neurones :
//   perceptions (capteurs de murs, direction et distance de l'ovule, vitesse) -> décision (tourner, accélérer).
// Les réseaux ne sont pas entraînés par gradient : ils évoluent. À chaque génération, les agents les plus
// performants se reproduisent (croisement des poids + mutation gaussienne).
const LIFESPAN = 500, MAX_SPEED = 4, RAY_LEN = 140, TURN = 0.2;
const RAYS = [-1.2, -0.6, 0, 0.6, 1.2];
const INPUT_NAMES = ['mur ←←', 'mur ←', 'mur ↑', 'mur →', 'mur →→', 'ovule sin', 'ovule cos', 'distance', 'vitesse'];
const OUTPUT_NAMES = ['tourner', 'accélérer'];
const N_IN = INPUT_NAMES.length, N_HID = 8, N_OUT = OUTPUT_NAMES.length;
const N_W = (N_IN + 1) * N_HID + (N_HID + 1) * N_OUT;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const chart = document.getElementById('chart'), cctx = chart.getContext('2d');
const brainCv = document.getElementById('brain'), bctx = brainCv.getContext('2d');
const $ = id => document.getElementById(id);

let W, H, egg, start, walls = [], pop = [], step = 0, gen = 1, best = 0, history = [], paused = false, champion = null;
let portrait = null, CW = 0, CH = 0, BW = 0, BH = 0;

// Le parcours suit la plus grande dimension de l'écran : de gauche à droite à l'horizontale,
// de bas en haut à la verticale (téléphone). Placement exprimé en fractions : p = avancée, q = côté.
const at = (p, q) => portrait ? { x: W * q, y: H * (1 - p) } : { x: W * p, y: H * q };
const wallAt = (p, q1, q2) => { const a = at(p, q1), b = at(p, q2); return { x1: a.x, y1: a.y, x2: b.x, y2: b.y }; };

function defaultLayout() {
  portrait = H > W;
  const r = Math.max(18, Math.min(28, Math.min(W, H) * 0.06));
  egg = { ...at(portrait ? 0.9 : 0.93, 0.5), r };
  walls = [wallAt(0.4, 0.2, 0.65), wallAt(0.65, 0.35, 0.85)];
}
function placeStart() {
  start = portrait ? { x: W / 2, y: H - 40, a: -Math.PI / 2 } : { x: 50, y: H / 2, a: 0 };
}

function fitCanvas(canvas, context) {
  const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
  canvas.width = r.width * d; canvas.height = r.height * d; context.setTransform(d, 0, 0, d, 0, 0);
  return r;
}

function resize() {
  const r = fitCanvas(cv, ctx);
  ({ width: CW, height: CH } = fitCanvas(chart, cctx));
  ({ width: BW, height: BH } = fitCanvas(brainCv, bctx));
  if (!r.width || !r.height) return;
  const oldW = W, oldH = H;
  W = r.width; H = r.height;
  if (!oldW || (H > W) !== portrait) {
    // Premier affichage ou rotation de l'écran : terrain par défaut, génération en cours relancée.
    defaultLayout(); placeStart();
    if (pop.length) { pop = pop.map(s => new Sperm(s.w)); champion = pop[0]; step = 0; }
    return;
  }
  // Simple changement de taille (barre d'adresse du navigateur mobile…) : tout suit proportionnellement.
  const sx = W / oldW, sy = H / oldH;
  egg.x *= sx; egg.y *= sy;
  for (const w of walls) { w.x1 *= sx; w.x2 *= sx; w.y1 *= sy; w.y2 *= sy; }
  placeStart();
}

const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());

// Réseau 9 -> 8 (tanh) -> 2 (tanh). Les poids sont le génome de l'agent.
function think(w, inputs) {
  const hidden = new Array(N_HID), out = new Array(N_OUT);
  let k = 0;
  for (let h = 0; h < N_HID; h++) {
    let s = w[k++];
    for (let i = 0; i < N_IN; i++) s += w[k++] * inputs[i];
    hidden[h] = Math.tanh(s);
  }
  for (let o = 0; o < N_OUT; o++) {
    let s = w[k++];
    for (let h = 0; h < N_HID; h++) s += w[k++] * hidden[h];
    out[o] = Math.tanh(s);
  }
  return { hidden, out };
}

// Distance du premier mur (ou bord) touché par un rayon, en fraction de RAY_LEN ; 1 = rien en vue.
function castRay(x, y, a) {
  const bx = x + Math.cos(a) * RAY_LEN, by = y + Math.sin(a) * RAY_LEN;
  let best = 1;
  for (const w of allWalls) { const t = intersect(x, y, bx, by, w); if (t !== null && t < best) best = t; }
  return best;
}
function intersect(ax, ay, bx, by, w) {
  const d = (bx - ax) * (w.y2 - w.y1) - (by - ay) * (w.x2 - w.x1);
  if (!d) return null;
  const t = ((w.x1 - ax) * (w.y2 - w.y1) - (w.y1 - ay) * (w.x2 - w.x1)) / d;
  const u = ((w.x1 - ax) * (by - ay) - (w.y1 - ay) * (bx - ax)) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? t : null;
}
let allWalls = [];
const borders = () => [{ x1: 0, y1: 0, x2: W, y2: 0 }, { x1: W, y1: 0, x2: W, y2: H }, { x1: W, y1: H, x2: 0, y2: H }, { x1: 0, y1: H, x2: 0, y2: 0 }];

class Sperm {
  constructor(genome) {
    this.w = genome || Array.from({ length: N_W }, gauss);
    this.x = start.x; this.y = start.y; this.a = start.a + (Math.random() - 0.5) * 0.5; this.v = 1;
    this.hit = false; this.dead = false; this.hitStep = LIFESPAN; this.minDist = Infinity;
    this.phase = Math.random() * 6.28; this.rays = RAYS.map(() => 1); this.last = null;
  }
  sense() {
    this.rays = RAYS.map(r => castRay(this.x, this.y, this.a + r));
    const dx = egg.x - this.x, dy = egg.y - this.y, rel = Math.atan2(dy, dx) - this.a;
    return [...this.rays.map(r => 1 - r), Math.sin(rel), Math.cos(rel),
            Math.min(1, Math.hypot(dx, dy) / Math.hypot(W, H)), this.v / MAX_SPEED];
  }
  update() {
    if (this.hit || this.dead) return;
    this.last = think(this.w, this.inputs = this.sense());
    const [turn, thrust] = this.last.out;
    this.a += turn * TURN;
    this.v = Math.max(0.3, Math.min(MAX_SPEED, this.v + thrust * 0.3));
    const nx = this.x + Math.cos(this.a) * this.v, ny = this.y + Math.sin(this.a) * this.v;
    if (allWalls.some(w => intersect(this.x, this.y, nx, ny, w) !== null)) { this.dead = true; return; }
    this.x = nx; this.y = ny; this.phase += 0.3 + this.v * 0.12;
    const d = Math.hypot(egg.x - this.x, egg.y - this.y);
    this.minDist = Math.min(this.minDist, d);
    if (d < egg.r) { this.hit = true; this.hitStep = step; }
  }
  fitness() {
    // Proche de l'ovule = mieux ; arrivé vite = beaucoup mieux ; mort contre un mur = pénalisé.
    let f = (1 - Math.min(1, this.minDist / Math.hypot(W, H))) ** 4;
    if (this.hit) f = 2 + (LIFESPAN - this.hitStep) / LIFESPAN * 2;
    if (this.dead) f *= 0.3;
    return f;
  }
  draw(isChampion) {
    if (isChampion && !this.dead && !this.hit) {
      ctx.strokeStyle = '#e3b34166'; ctx.lineWidth = 1;
      RAYS.forEach((r, i) => {
        const len = this.rays[i] * RAY_LEN;
        ctx.beginPath(); ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + Math.cos(this.a + r) * len, this.y + Math.sin(this.a + r) * len); ctx.stroke();
      });
    }
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.a);
    ctx.globalAlpha = this.dead ? 0.2 : 0.9;
    ctx.strokeStyle = isChampion ? '#e3b341' : this.hit ? '#3fb950' : '#c9d1d9';
    ctx.lineWidth = isChampion ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(-3, 0);
    for (let i = 1; i <= 8; i++) ctx.lineTo(-3 - i * 2, Math.sin(this.phase - i * 0.8) * i * 0.4);
    ctx.stroke();
    const s = isChampion ? 1.4 : 1;
    ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.ellipse(0, 0, 4 * s, 2.6 * s, 0, 0, 6.28); ctx.fill();
    ctx.restore();
  }
}

function newPopulation() { pop = Array.from({ length: +$('popSize').value }, () => new Sperm()); champion = pop[0]; step = 0; }

function placeEggRandomly() {
  for (let tries = 0; tries < 50; tries++) {
    // Moitié du terrain opposée au départ, à distance des bords et des murs.
    const { x, y } = at(0.55 + Math.random() * 0.4, Math.max(0.08, Math.min(0.92, Math.random())));
    if (walls.every(w => distToSeg(x, y, w) > egg.r + 10)) { egg.x = x; egg.y = y; return; }
  }
}
function distToSeg(px, py, w) {
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1, l = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - w.x1) * dx + (py - w.y1) * dy) / l));
  return Math.hypot(px - w.x1 - t * dx, py - w.y1 - t * dy);
}

function evolve() {
  const fits = pop.map(s => s.fitness());
  const hits = pop.filter(s => s.hit).length;
  history.push(hits / pop.length); if (history.length > 60) history.shift();
  best = Math.max(best, hits);
  // Sélection par tournoi : robuste aux écarts d'échelle de la fitness.
  const pick = () => { let b = Math.random() * pop.length | 0; for (let i = 0; i < 3; i++) { const c = Math.random() * pop.length | 0; if (fits[c] > fits[b]) b = c; } return pop[b].w; };
  const rate = +$('mut').value / 100, n = +$('popSize').value;
  const order = fits.map((f, i) => i).sort((a, b) => fits[b] - fits[a]);
  const next = order.slice(0, 2).map(i => new Sperm(pop[i].w.slice())); // élitisme : les 2 meilleurs survivent intacts
  while (next.length < n) {
    const a = pick(), b = pick();
    next.push(new Sperm(a.map((g, i) => (Math.random() < 0.5 ? g : b[i]) + (Math.random() < rate ? gauss() * 0.5 : 0))));
  }
  pop = next; champion = pop[0]; step = 0; gen++;
  if ($('roam').checked) placeEggRandomly();
}

function tick() {
  allWalls = [...walls, ...borders()];
  for (const s of pop) s.update();
  step++;
  if (step >= LIFESPAN || pop.every(s => s.dead || s.hit)) evolve();
}

function drawBrain() {
  if (!BW) return; // panneau masqué
  bctx.clearRect(0, 0, BW, BH);
  bctx.fillStyle = '#8b949e'; bctx.font = '10px system-ui'; bctx.fillText('Cerveau du champion', 6, 12);
  const c = champion, w = c.w, act = c.last, inputs = c.inputs || new Array(N_IN).fill(0);
  const col = (x, n, i) => ({ x: x * BW / 220, y: 22 + (i + 0.5) * ((BH - 28) / n) });
  const inP = INPUT_NAMES.map((_, i) => col(60, N_IN, i)), hidP = Array.from({ length: N_HID }, (_, i) => col(120, N_HID, i)), outP = OUTPUT_NAMES.map((_, i) => col(170, N_OUT, i));
  const edge = (p, q, weight) => {
    bctx.strokeStyle = weight > 0 ? `rgba(88,166,255,${Math.min(0.8, Math.abs(weight) / 3)})` : `rgba(248,81,73,${Math.min(0.8, Math.abs(weight) / 3)})`;
    bctx.beginPath(); bctx.moveTo(p.x, p.y); bctx.lineTo(q.x, q.y); bctx.stroke();
  };
  bctx.lineWidth = 0.7;
  let k = 0;
  for (let h = 0; h < N_HID; h++) { k++; for (let i = 0; i < N_IN; i++) edge(inP[i], hidP[h], w[k++]); }
  for (let o = 0; o < N_OUT; o++) { k++; for (let h = 0; h < N_HID; h++) edge(hidP[h], outP[o], w[k++]); }
  const node = (p, v) => { bctx.fillStyle = `hsl(${v >= 0 ? 210 : 0} 80% ${30 + Math.abs(v) * 40}%)`; bctx.beginPath(); bctx.arc(p.x, p.y, 4, 0, 6.28); bctx.fill(); };
  bctx.fillStyle = '#8b949e'; bctx.font = '9px system-ui'; bctx.textAlign = 'right';
  INPUT_NAMES.forEach((name, i) => { bctx.fillStyle = '#8b949e'; bctx.fillText(name, inP[i].x - 6, inP[i].y + 3); node(inP[i], inputs[i]); });
  hidP.forEach((p, i) => node(p, act ? act.hidden[i] : 0));
  bctx.textAlign = 'left';
  OUTPUT_NAMES.forEach((name, i) => { node(outP[i], act ? act.out[i] : 0); bctx.fillStyle = '#8b949e'; bctx.fillText(name, outP[i].x + 7, outP[i].y + 3); });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createRadialGradient(egg.x, egg.y, 4, egg.x, egg.y, egg.r * 1.6);
  g.addColorStop(0, '#ffd6e6'); g.addColorStop(0.6, '#f2a7c3'); g.addColorStop(1, '#f2a7c300');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(egg.x, egg.y, egg.r * 1.6, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#6e7681'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const w of [...walls, drawing].filter(Boolean)) { ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke(); }
  for (const s of pop) if (s !== champion) s.draw(false);
  champion.draw(true);
  ctx.fillStyle = '#8b949e'; ctx.fillRect(0, H - 3, W * step / LIFESPAN, 3);
  $('gen').textContent = gen; $('hits').textContent = pop.filter(s => s.hit).length;
  $('pop').textContent = pop.length; $('best').textContent = best;
  cctx.clearRect(0, 0, CW, CH);
  cctx.fillStyle = '#8b949e'; cctx.font = '10px system-ui'; cctx.fillText('% arrivés par génération', 6, 12);
  cctx.strokeStyle = '#3fb950'; cctx.lineWidth = 1.5; cctx.beginPath();
  history.forEach((v, i) => { const x = 6 + i * ((CW - 12) / 59), y = CH - 6 - v * (CH - 24); i ? cctx.lineTo(x, y) : cctx.moveTo(x, y); });
  cctx.stroke();
  drawBrain();
}

function loop() {
  if (!paused) for (let i = 0; i < +$('speed').value; i++) tick();
  draw(); requestAnimationFrame(loop);
}

// Interaction : dessiner des murs, déplacer l'ovule.
let drawing = null, pressTimer = null;
const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const moveEgg = p => { egg.x = p.x; egg.y = p.y; };
cv.addEventListener('contextmenu', e => { e.preventDefault(); moveEgg(pos(e)); });
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (header.classList.contains('open')) { closeMenu(); return; } // toucher le terrain ferme le menu
  cv.setPointerCapture(e.pointerId);
  const p = pos(e); drawing = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  pressTimer = setTimeout(() => { drawing = null; moveEgg(p); }, 550);
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return; const p = pos(e); drawing.x2 = p.x; drawing.y2 = p.y;
  if (Math.hypot(drawing.x2 - drawing.x1, drawing.y2 - drawing.y1) > 6) clearTimeout(pressTimer);
});
addEventListener('pointerup', () => {
  clearTimeout(pressTimer);
  if (drawing && Math.hypot(drawing.x2 - drawing.x1, drawing.y2 - drawing.y1) > 10) walls.push(drawing);
  drawing = null;
});
addEventListener('pointercancel', () => { clearTimeout(pressTimer); drawing = null; });

// Menu des réglages (téléphone).
const header = $('header'), menu = $('menu');
function closeMenu() { header.classList.remove('open'); menu.setAttribute('aria-expanded', 'false'); }
menu.onclick = () => { const open = header.classList.toggle('open'); menu.setAttribute('aria-expanded', String(open)); };
$('brainToggle').onclick = e => {
  const shown = document.body.classList.toggle('show-brain');
  e.target.classList.toggle('on', shown);
  resize();
};

$('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Reprendre' : 'Pause'; e.target.classList.toggle('on', paused); };
$('clearWalls').onclick = () => { walls = []; };
$('reset').onclick = () => { gen = 1; best = 0; history = []; newPopulation(); };
$('popSize').oninput = e => $('popV').textContent = e.target.value;
$('mut').oninput = e => $('mutV').textContent = e.target.value + '%';
$('speed').oninput = e => $('speedV').textContent = '×' + e.target.value;
new ResizeObserver(resize).observe($('wrap'));

// Installation comme application (PWA).
// Android / Chrome / Edge : fenêtre d'installation native via beforeinstallprompt.
// iPhone / iPad : Safari n'offre aucune API d'installation, on affiche la marche à suivre.
const installBtn = $('install'), installHelp = $('installHelp');
const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installPrompt = null;

if (!standalone && isIOS) installBtn.hidden = false;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; installBtn.hidden = false; });
addEventListener('appinstalled', () => { installPrompt = null; installBtn.hidden = true; });

function showInstallHelp(steps) {
  $('installSteps').innerHTML = steps.map(step => `<li>${step}</li>`).join('');
  installHelp.hidden = false;
}
installBtn.onclick = async () => {
  closeMenu();
  if (installPrompt) {
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    if (outcome === 'accepted') installBtn.hidden = true;
    installPrompt = null;
  } else if (isIOS) {
    showInstallHelp([
      'Ouvrez cette page dans <b>Safari</b>.',
      'Touchez le bouton <b>Partager</b> (carré avec une flèche vers le haut).',
      'Choisissez <b>Sur l\'écran d\'accueil</b>, puis <b>Ajouter</b>.',
    ]);
  }
};
$('installClose').onclick = () => { installHelp.hidden = true; };
installHelp.onclick = e => { if (e.target === installHelp) installHelp.hidden = true; };

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

resize(); newPopulation(); loop();
</script>
</body>
</html>
