name: App Android

on:
  push:
    paths:
      - "mobile/**"
      - "public/**"
      - "src/**"
      - "test/**"
      - "package*.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # publication de l'APK en Release

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  apk:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # Le code partagé (src/, public/) utilise les dépendances de la racine.
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: Construire l'app web et la copier dans le projet Android
        working-directory: mobile
        run: npm run sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compiler l'APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "notes-reunion-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: notes-reunion-apk
          path: notes-reunion-*.apk

      # Release téléchargeable directement depuis le navigateur du téléphone.
      - name: Publier la Release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Notes Réunion Android 1.0.${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: notes-reunion-*.apk
          body: |
            APK de l'app Notes Réunion (branche `${{ github.ref_name }}`, commit ${{ github.sha }}).

            Installation : ouvrez cette page sur le téléphone Android, touchez le fichier `.apk`, puis autorisez l'installation depuis le navigateur si Android le demande.
